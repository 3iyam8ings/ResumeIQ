# H2 exists only for automated tests. The running application always uses PostgreSQL.
spring.datasource.url=jdbc:h2:mem:resumeiq-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Test-only values keep the Spring context independent from a developer's .env file.
gemini.api.key=test-key
spring.security.oauth2.client.registration.github.client-id=test-github-client
spring.security.oauth2.client.registration.github.client-secret=test-github-secret
spring.security.oauth2.client.registration.google.client-id=test-google-client
spring.security.oauth2.client.registration.google.client-secret=test-google-secret
spring.mail.username=test@example.com
spring.mail.password=test-password
