spring.application.name=demo
spring.config.import=optional:file:.env[.properties]
server.port=8082
server.forward-headers-strategy=framework

# Upload Size Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# PostgreSQL configuration
#
# DB_* is the supported configuration for local Docker PostgreSQL and hosted
# PostgreSQL providers. SUPABASE_DB_* remains as a temporary compatibility
# fallback for existing local .env files.
spring.datasource.url=${DB_URL:${SUPABASE_DB_URL:jdbc:postgresql://localhost:5433/resume_db}}
spring.datasource.username=${DB_USERNAME:${SUPABASE_DB_USERNAME:postgres}}
spring.datasource.password=${DB_PASSWORD:${SUPABASE_DB_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

# Session Configuration
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always

# Hibernate Configuration - Automatically create/update schema
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Gemini AI Configuration
gemini.api.key=${GEMINI_API_KEY}

# OAuth2 Configuration (GitHub)
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email
spring.security.oauth2.client.registration.github.redirect-uri=https://resume-iq-teal.vercel.app/login/oauth2/code/github


# OAuth2 Configuration (Google)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri=https://resume-iq-teal.vercel.app/login/oauth2/code/google

# Mail Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# application-prod.properties
server.servlet.session.cookie.same-site=None
server.servlet.session.cookie.secure=true
